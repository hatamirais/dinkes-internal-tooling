# Source fragment for the "duty_travel" module.
#
# MVP contract scaffold for SiPerdin Dinkes Kobar. This file is the source
# fragment; openapi/awcms-public-api.openapi.yaml is generated by
# `bun run openapi:bundle`.
paths:
  /api/v1/duty-travel/requests:
    get:
      operationId: listDutyTravelRequests
      tags:
        - Duty Travel
      summary: List duty travel requests for the active tenant.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DutyTravelRequestStatus"
        - name: requestKind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DutyTravelRequestKind"
      responses:
        "200":
          description: Duty travel request list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: "#/components/schemas/DutyTravelRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDutyTravelRequest
      tags:
        - Duty Travel
      summary: Create a draft duty travel request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DutyTravelRequestCreate"
      responses:
        "200":
          description: Created draft request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/DutyTravelRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/duty-travel/requests/{id}/submit:
    post:
      operationId: submitDutyTravelRequest
      tags:
        - Duty Travel
      summary: Submit a draft or returned request into approval workflow.
      description: High-risk state transition; requires Idempotency-Key.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      responses:
        "200":
          description: Submitted request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/DutyTravelRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/duty-travel/dashboard/summary:
    get:
      operationId: getDutyTravelDashboardSummary
      tags:
        - Duty Travel
      summary: Read dashboard summary counters for the active tenant.
      responses:
        "200":
          description: Dashboard counters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/DutyTravelDashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  schemas:
    DutyTravelRequestKind:
      type: string
      enum:
        - task_only
        - task_with_sppd
    DutyTravelRequestScope:
      type: string
      enum:
        - dinkes
        - faskes
    DutyTravelRequestStatus:
      type: string
      enum:
        - draft
        - submitted
        - returned
        - rejected
        - supervisor_verified
        - technical_verified
        - secretary_verified
        - finance_verified
        - final_approved
        - document_issued
        - in_progress
        - evidence_submitted
        - evidence_returned
        - evidence_verified
        - completed
        - archived
        - cancelled
    DutyTravelRequest:
      type: object
      required:
        - id
        - requestKind
        - requestScope
        - status
        - title
        - startsOn
        - endsOn
      properties:
        id:
          type: string
          format: uuid
        requestKind:
          $ref: "#/components/schemas/DutyTravelRequestKind"
        requestScope:
          $ref: "#/components/schemas/DutyTravelRequestScope"
        status:
          $ref: "#/components/schemas/DutyTravelRequestStatus"
        title:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        isUrgent:
          type: boolean
    DutyTravelRequestCreate:
      type: object
      required:
        - requestKind
        - requestScope
        - title
        - basis
        - purpose
        - expectedOutput
        - startsOn
        - endsOn
      properties:
        requestKind:
          $ref: "#/components/schemas/DutyTravelRequestKind"
        requestScope:
          $ref: "#/components/schemas/DutyTravelRequestScope"
        title:
          type: string
          minLength: 3
          maxLength: 200
        basis:
          type: string
          minLength: 1
        purpose:
          type: string
          minLength: 1
        expectedOutput:
          type: string
          minLength: 1
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        isUrgent:
          type: boolean
        urgentReason:
          type: string
    DutyTravelDashboardSummary:
      type: object
      properties:
        totalRequests:
          type: integer
          minimum: 0
        pendingApprovals:
          type: integer
          minimum: 0
        issuedDocuments:
          type: integer
          minimum: 0
        overdueEvidence:
          type: integer
          minimum: 0
